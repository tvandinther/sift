[package]
name = "sift"
version = "0.1.1"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"
tokenizers = "0.20"
ureq = "2.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"
ignore = "0.4"
sha2 = "0.10"
anyhow = "1.0"
tokio = { version = "1.41", features = ["full"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
